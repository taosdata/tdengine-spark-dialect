name: build
permissions:
  contents: read
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - '*.txt'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - '*.txt'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Start TDengine
        run: |
          docker run -d --name tdengine -p 6030:6030 -p 6041:6041 tdengine/tdengine:latest
          echo "Waiting for TDengine (taosd + taosAdapter) to become ready..."
          for i in $(seq 1 90); do
            code=$(curl -s -u root:taosdata -d "show databases" \
              http://127.0.0.1:6041/rest/sql 2>/dev/null | grep -o '"code":[0-9]*' | cut -d: -f2)
            if [ "$code" = "0" ]; then
              echo "TDengine is ready"
              exit 0
            fi
            sleep 2
          done
          echo "TDengine did not become ready in time"
          docker logs tdengine
          exit 1

      - name: Run tests
        run: mvn -B clean verify

      - name: Show TDengine logs on failure
        if: failure()
        run: docker logs tdengine | tail -100
